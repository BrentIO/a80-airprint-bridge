name: 🛠️ Build Firmware

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Release version (YYYY.MM.NN); empty for a development build (9999.99.99)'
        type: string
        required: false
        default: ''
    outputs:
      artifact:
        description: 'Name of the uploaded firmware artifact'
        value: ${{ jobs.build.outputs.artifact }}

concurrency:
  group: build-firmware-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Compiler cache: a warm cache cuts the build from ~45 s to ~17 s
  IDF_CCACHE_ENABLE: "1"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 100M
  # Stamped into the firmware (printed on the serial console at boot); the PR head, not the merge commit
  A80_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # Release version from the release workflow; empty means a development build (9999.99.99)
  A80_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build ESP32-S3 firmware
    runs-on: ubuntu-24.04

    # Same image as the local build (see README.md): ESP-IDF 5.5
    container: espressif/idf:v5.5

    permissions:
      contents: read

    outputs:
      artifact: ${{ steps.name.outputs.artifact }}

    defaults:
      run:
        shell: bash
        working-directory: firmware

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Trust the checked-out workspace
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py build

      - name: Compiler cache statistics
        run: ccache -s | grep -E 'Hits|Misses|Cache size'

      - name: Firmware size
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          {
            echo '### Firmware size'
            echo '```'
            idf.py size | grep -E 'Total image size|Flash Code|Flash Data|DIRAM|IRAM'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create flashable image
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          # a release is named by its version, a development build by its commit
          idf.py merge-bin -o "a80-airprint-${A80_VERSION:-${A80_COMMIT::7}}.bin"
          ls -l build/a80-airprint-*.bin

      - name: Name the artifact
        id: name
        shell: bash
        run: echo "artifact=a80-airprint-${A80_VERSION:-${A80_COMMIT::7}}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          # One image, flash at address 0x0 (README.md)
          path: firmware/build/a80-airprint-*.bin
          if-no-files-found: error
          retention-days: 14
