name: 🚀 Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (YYYY.MM.NN)'
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Releases are made from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "❌ Run this workflow on the main branch (it was started on $GITHUB_REF)"
            exit 1
          fi

      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{4}\.(0[1-9]|1[0-2])\.(0[1-9]|[1-9][0-9])$ ]]; then
            echo "❌ Invalid version format: $VERSION. Expected YYYY.MM.NN (for example 2026.11.01)"
            exit 1
          fi
          echo "✅ Version format is valid: $VERSION"

      - name: Version must not already exist
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "❌ The tag $VERSION already exists"
            exit 1
          fi
          echo "✅ $VERSION is a new version"

  # The same build that every pull request must pass, stamped with the release version
  build:
    name: Build
    needs: validate
    uses: ./.github/workflows/build-firmware.yaml
    permissions:
      contents: read
    with:
      version: ${{ inputs.version }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Download firmware image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/a80-airprint-${{ inputs.version }}.bin
